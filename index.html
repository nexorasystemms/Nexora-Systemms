<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Nexora Systems — Enterprise Autonomous AI Workforce</title>
    <meta name="description" content="Nexora Systems provides autonomous AI agents for enterprise organisations — customer support, sales, finance, and operations. Deployed in under 48 hours on an isolated private cloud." />
    <meta name="author" content="Nexora Systems (Pty) Ltd" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#00288e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1c30" media="(prefers-color-scheme: dark)" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nexorasystems.solutions/" />

    <!-- Favicons & PWA icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/nexora-mark.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/nexora-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/nexora-mark.png" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://nexorasystems.solutions/" />
    <meta property="og:title"       content="Nexora Systems — Enterprise Autonomous AI Workforce" />
    <meta property="og:description" content="Deploy autonomous AI agents for support, sales, finance and operations in under 48 hours. Private cloud, zero data leakage, human-in-the-loop SLA." />
    <meta property="og:image"       content="/brand/nexora-logo-horizontal.png" />
    <meta property="og:locale"      content="en_NA" />
    <meta property="og:site_name"   content="Nexora Systems" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nexora Systems — Enterprise Autonomous AI Workforce" />
    <meta name="twitter:description" content="Deploy autonomous AI agents for support, sales, finance and operations in under 48 hours." />
    <meta name="twitter:image"       content="/brand/nexora-logo-horizontal.png" />

    <!-- Preconnect for font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fonts loaded with display=swap so text is immediately visible while fonts load.
      Material Symbols Outlined is a variable icon font — wght/FILL/GRAD axes kept
      to their full range so all icon styles render without a second request.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
